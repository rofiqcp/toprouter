# TopRouter Nginx Configuration - HIGH PERFORMANCE (5000+ concurrent)
# Tuned for 40 cores, 23GB RAM

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=toprouter_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=toprouter_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=toprouter_general:10m rate=50r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=toprouter_conn:10m;

# Cache for static assets
proxy_cache_path /var/cache/nginx/toprouter levels=1:2 keys_zone=toprouter_static:100m max_size=1g inactive=7d use_temp_path=off;

upstream toprouter_backend {
    server 127.0.0.1:20129 max_fails=3 fail_timeout=30s;
    keepalive 256;
}

server {
    listen 80 backlog=65535;
    listen [::]:80 backlog=65535;
    server_name localhost toprouter.local;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size for uploads
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Connection limits (max 100 concurrent per IP for high throughput)
    limit_conn toprouter_conn 100;

    # Logging
    access_log /var/log/nginx/toprouter-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/toprouter-error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Static files (provider logos, icons)
    location ~* ^/(providers|icons|favicon\.(ico|svg))/ {
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache for 7 days
        proxy_cache toprouter_static;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Login endpoint - strict rate limiting
    location = /api/auth/login {
        limit_req zone=toprouter_login burst=3 nodelay;
        
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API endpoints - moderate rate limiting
    location /api/ {
        limit_req zone=toprouter_api burst=200 nodelay;
        
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering for performance
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }

    # Next.js static files (_next/static)
    location /_next/static {
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache for 1 year
        proxy_cache toprouter_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # All other traffic - general rate limiting
    location / {
        limit_req zone=toprouter_general burst=100 nodelay;
        
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }

    # Health check (no rate limit)
    location = /api/health {
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
