upstream toprouter_backend {
    server 127.0.0.1:20129;
    keepalive 64;
}

server {
    listen 80;
    server_name toprouter.local localhost;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    
    # Static files - served directly by nginx (high performance)
    location /_next/static/ {
        alias /media/sirobo/Data/Riset/toprouter/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    location /public/ {
        alias /media/sirobo/Data/Riset/toprouter/public/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    # Favicon and other static assets
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        root /media/sirobo/Data/Riset/toprouter/public;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    # API and dynamic requests - proxy to Node.js
    location / {
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # Health check endpoint
    location /api/health {
        proxy_pass http://toprouter_backend;
        access_log off;
    }
    
    # Rate limiting for login attempts
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://toprouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|git|log|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
